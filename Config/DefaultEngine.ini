; === Network bandwidth + server net-tick tuning (og-netcode-v1-impl Phase 2a) ===
; These settings bind on the IpNetDriver — the project's ACTUAL live net driver —
; NOT [/Script/Engine.GameNetDriver] (which the project does not use). Per T18 §4
; the project previously had NO IpNetDriver section and silently inherited
; BaseEngine.ini's MaxClientRate=100000.
;
; What each setting does:
;   MaxClientRate         server->client send ceiling, in BYTES PER SECOND per
;                         UNetConnection (clamps replication + RPC traffic to each
;                         connected client).
;   MaxInternetClientRate the internet-play override of that same ceiling (UE picks
;                         LAN vs internet via -lanplay); kept EQUAL to MaxClientRate
;                         to avoid a LAN-vs-internet split surprise.
;   NetServerMaxTickRate  the server's NETWORK tick rate in Hz — the rate at which
;                         the server flushes RPCs and runs replication. This is
;                         SEPARATE from the simulation/physics tick rate (the 60 Hz
;                         Chaos async-physics tick set via AsyncFixedTimeStepSize in
;                         the [/Script/Engine.PhysicsSettings] block above).
;
; Why these values — Tier 1 + Tier 2 + Hadouken bandwidth headroom at the 60 Hz target:
;   The 250000 cap covers EVERY topology in the locked 4-scenario set
;   {1x3, 3x1, 2x3, 6x1} at the 60 Hz net tick with margin, INCLUDING the future
;   Hadouken projectile-pool re-wire (+196 B/char per proposal §1.1 row 2).
;   Worst-case projected per-connection demand at 60 Hz from the T22 closed-form
;   model: Tier-1 1x3 upstream ~169 KB/s (3-LP input bundle); Tier-2 2x3
;   downstream ~154 KB/s (6 chars × per-tick state to each connection);
;   Tier-2 + Hadouken downstream ~224 KB/s. 250000 sits ~12% above the
;   Tier-2 + Hadouken worst case and ~48% above the strict Tier-1 minimum
;   (~169 KB/s) — a well-provisioned ceiling that needs no second bump when
;   Tier 2 ships or when the Hadouken projectile sub-sim re-wires. The previously
;   inherited 30 Hz net tick would HALVE the effective update rate of the 60 Hz
;   sim, so NetServerMaxTickRate=60 pairs the server net tick with the
;   post-Stage-2 60 Hz Chaos async-physics tick (ratified per Synthesis
;   Decision C.5). The cap is platform-independent — cellular bytes equal LAN
;   bytes (T20); cellular is latency/loss-bound, not bandwidth-bound. See
;   research/spike_max_client_rate_ceiling.md §9 (Tier 1 verdict) + §10 (Tier 2
;   verdict) + §11 (per-platform recommendation) + §15 (methodology critique).
;
; Provenance: og-netcode-v1-impl Phase 2a — T18 setting matrix, T19 24-cell LAN
;   ramp, T20 20-cell cellular ramp, T22 bandwidth model + headroom curve, T21
;   Tier 1/Tier 2 synthesis verdict. T21 strict-tier recommendations were
;   200000 (Tier 1) / 250000 (Tier 2 + Hadouken); this file provisions the
;   higher Tier-2+Hadouken value directly so a second INI bump is not needed
;   when Tier 2 or Hadouken ships. The higher value has no runtime cost — the
;   cap is a CEILING, not a target; UE only sends what it actually needs, up to
;   the cap. T19/T20 measured demand sits at the per-tier plateau regardless of
;   cap value above the knee.
;
; CI gate note: the per-tick budget gate referenced in research §12 should pin
;   to per-TIER demand values (~160 KB/s Tier 1 / ~200 KB/s Tier 2), NOT 80% of
;   this cap — because the cap is now provisioned above the Tier working budget.
;   The cap is for absorbing burst events (attacks, projectile spawns, hit RPCs)
;   that the §15-acknowledged "idle-character" measurement methodology did not
;   fully characterize.
;
; Tier player-count constants (maxPlayersPerServer=3, maxPlayersPerServerTier2=6,
;   maxLocalPlayersPerClient=3) live in
;   Plugins/OGBrawler/Source/OGBrawler/og-brawler/OGBrawler/SessionConstants.h.
[/Script/OnlineSubsystemUtils.IpNetDriver]
MaxClientRate=250000
MaxInternetClientRate=250000
NetServerMaxTickRate=60
