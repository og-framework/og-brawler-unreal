[Core.Log]
; Rare simulation lifecycle: TimeResync.*, Resim.Pre/Post, ResimCheck.Divergence/PrepareRestore.
; NOTE (T19): Resim.Input is NOT here. It is per-character-per-resim-tick, so it
; was re-routed to LogOGSimTick where its volume class belongs.
LogOGSim=Verbose
; Per-tick simulation chatter: AuthoritySimulation, ClientPrediction, CollectInput,
; ResimCheck.*, and (T19) Resim.Input — the resim resolution table.
; Default Warning to silence high-volume per-tick spam.
LogOGSimTick=Warning
; Manager / simulatable lifecycle: SimulationManager:*, tryRegister:*, NewFramework:*.
LogOGMgmt=Verbose
; Replication-channel events: ServerReceive, Send*ToClients, ReceiveCorrection*, InjectCorrection*.
; Default Warning. Flip to Verbose when investigating replication timing.
LogOGNet=Warning
; Fallback for any prefix the router does not recognize.
LogOG=Warning
; Per-connection tier relay lifecycle (ASimulationConnectionRelay): spawn, reap,
; and the client-side tier OnRep. Rare by construction (tier changes are
; dwell-gated), so Log is affordable and makes the channel traceable without
; flipping LogOGNet. The tier VALUE detail still lives under LogOGNet.
LogOGConnRelay=Log
; [T19] Relay telemetry. CLIENT side: RelayProbe.Read (scheduled-read hit rate, one
; line per call site per window), RelayProbe.Arrival (replication cadence in CAPTURE
; ticks, with a p99), RelayProbe.Stale (max consecutive fallback run).
; [T20] adds, still client side: RelayProbe.Miss (WHY each miss missed -- in-span
; coverage hole / above newest / below oldest / no probe tick) and RelayProbe.Delta
; (the signed probeTick-minus-newest distribution, p10/p50/p90). And, SERVER side,
; RelayProbe.Frame -- sim ticks per server game-thread frame plus Chaos's sub-step
; count, which is the measurement that says whether the client-measured arrival gap
; is a host-performance artefact or a replication defect.
;
; INDEPENDENT SILENCING, which is the reason this is its own category:
;   Warning   (this default) -- keeps the per-WINDOW summaries, drops the per-EVENT
;                               Verbose detail. Up to 7 lines per 120 client ticks
;                               (~2 s), most of them gated on having something to
;                               report, plus one per 120 arrival samples, plus 2 per
;                               120 server frames.
;   Verbose                  -- adds the per-event lines: every verify-fail, every
;                               read landing below the store's oldest entry, and
;                               every arrival whose capture-tick gap exceeded 1.
;   NoLogging                -- drops BOTH, without touching any other channel.
; NOTE (T20): the T19-era claim that "nothing here fires on a dedicated server" no
; longer holds -- RelayProbe.Frame is server-only, and it is the only one that is.
LogOGRelayProbe=Warning
; [T24] Prediction-vs-authority telemetry. CLIENT side only -- the authority
; receives no corrections, so nothing here fires on a dedicated server.
;   DivergenceProbe.Correction -- one line per LANDED correction, carrying the
;     character id, its CLASS (RemoteProxy vs LocallyPredicted, decided by the same
;     provider-presence test collectInputAll forks on) and the existing
;     `isSimilarTo` verdict. The verdict is NOT new: StateCorrectionCache has always
;     computed it on every correction. It was invisible because its log line carries
;     no tag and therefore fell to LogOG=Warning -- zero occurrences in the clean
;     floor-0 run. This category is the route that fixes that.
;   DivergenceProbe.Window -- one line per CLASS per 120 corrections: corrections
;     seen, corrections that disagreed, and the rate in parts per thousand. The two
;     classes are never pooled, because only the remote half can move with
;     RelayDelayFloorTicks and summing them dilutes exactly that signal.
;
; INDEPENDENT SILENCING, which is why this is its own category:
;   Warning   (this default) -- keeps the per-WINDOW class summaries (~2 lines per
;                               120 corrections), drops the per-correction detail.
;   Verbose                  -- adds one line per landed correction per character.
;   NoLogging                -- drops BOTH, without touching any other channel.
;
; READ THIS BEFORE DRAWING A CONCLUSION FROM THE RATE. Corrections that DISAGREE are
; already rare at floor 0 (8 and 17 resim triggers in a ~45 s clean run), so a higher
; floor has almost no room to reduce the RATE. If the floor helps it helps by making
; the corrections that still occur SMALLER -- a MAGNITUDE, which nothing records:
; isSimilarTo is a boolean fold that discards the distance. That is backlog T28 and
; it is DEFERRED. So "the rate did not change" here is UNINFORMATIVE, not negative.
LogOGDivergenceProbe=Warning
; [item 42] Resim-gate telemetry. CLIENT side only -- the authority never resims,
; and every hook here is downstream of a runsPrediction() short-circuit, so a
; dedicated-server log contains ZERO ResimProbe lines. That absence is the expected
; result, not a fault; it is also this family's constructed dead-instrument case.
;
; WHAT IT MEASURES, and why it was worth a category. Item 31 established that resim
; triggers are gated by the prediction-frontier slot's INHERITED m_isResimulated bit:
; getLastResimulationTick scans from the frontier at offset 0, so that bit shadows
; every older corrected slot, and the gate re-opens ONLY when a correction lands
; exactly ON the frontier. Corrections landing behind it trigger nothing and never
; touch live state. So resim frequency measures how often the correction stream
; touches the frontier exactly -- NOT how often prediction diverged. 4,552
; corrections, every one judged correct=0, produced 59 triggers.
;
;   ResimProbe.Gate    -- I1, the DENOMINATOR: divergence checks per window, split
;     declined/requested, plus the request rate in parts per thousand. This closes
;     the hole item 31 named. Its predecessor [ResimCheck.IsSimilar] emits at Log
;     under LogOGSimTick=Warning and has ZERO occurrences in every log on disk.
;   ResimProbe.Chaos   -- I3+I4, the SECOND gate: requests / grants / refused /
;     repeat / clamped / depthMin / depthMax. Chaos's own refusal diagnostics are
;     compiled out behind DEBUG_REWIND_DATA, so before this a refused rewind was
;     completely silent. Measured baseline: 15-31 % refused.
;   ResimProbe.Apply   -- I5+I6: prepares / finishes / abandoned / stuck /
;     replayTicks / replayOverruns. ~20 % of GRANTED rewinds never reach the apply
;     edge in every archived run. Prefer `stuck` to `abandoned` on a single window
;     (`abandoned` carries a +-1 window-boundary term; `stuck` does not).
;   ResimProbe.Landing -- I2, one line per CLASS per 120 corrections: behind /
;     atFrontier / discarded. `behind` large while the Gate line's `requested` stays
;     small IS the under-resimulation statement. `discarded` is item 41's aboveNewest
;     population. GAME thread, so it is a separate window from the three above --
;     they are fed by different threads and are deliberately never merged.
;
; INDEPENDENT SILENCING, which is why this is its own category:
;   Warning   (this default) -- keeps the per-WINDOW summaries: 3 lines per 120
;                               physics frames (~2 s) plus up to 2 per 120
;                               corrections. Max 5 per window, budget is 6.
;   Verbose                  -- adds ResimProbe.Request (per trigger, carrying the
;                               ChaosTickMapper offset), ResimProbe.Landing (per
;                               correction) and ResimProbe.Stranded (ONE per
;                               abandoned resim episode, not per stuck frame).
;   NoLogging                -- drops BOTH, without touching any other channel.
;
; ⛔ DO NOT REFILE THIS FAMILY UNDER A [Resim. OR [ResimCheck. TAG. [Resim. inherits
; LogOGSim=Verbose (T19 measured that as 98.4 % of a 10 MB log) and [ResimCheck.
; splits across LogOGSim and LogOGSimTick, so it could not be switched as one thing.
;
; ⚠ READ THIS BEFORE DRAWING A CONCLUSION. This family measures the GATE, not
; correctness. It can tell you that behind-frontier corrections are being suppressed;
; it cannot tell you whether that MATTERS, because the suppressed corrections'
; magnitude is not recorded anywhere (isSimilarTo is a boolean fold that discards the
; distance). That is backlog item 28 and it is DEFERRED. Also: `clamped=0` on the
; Chaos line is a STRUCTURAL CONSTANT of this wiring, not an unexercised counter -- a
; shallow clamp is impossible (FindValidResimFrame walks downward; the engine's Min
; merge can only deepen); a nonzero means engine behaviour changed, not tuning drift.
LogOGResimProbe=Warning
; OGBrawler game-rule logging (DAttackMachine/Radial/Guard via OGBLOG_G).
; Off by default — flip to Verbose when debugging attack-state logic.
LogOGBrawler=Warning

[OGNetcode]
RelayDelayFloorTicks=6
; [T33] Relay ring redundancy depth (entries retained per character per round).
; [T35] LIVE — read on the SERVER at SimulationManagerUImpl's composition root, clamped to
; [1, relayedInputRing::kMaxDepth = 8], and pushed into TimeConfig::relayRedundancyDepthTicks
; before the first relay write. Absent => the compiled default 1 (replace-latest). Server-only:
; the depth is passed per ring write and never replicated. Consumed ONCE per session, so a
; change needs a PIE restart, not a hot-reload. The effective value is logged at startup as
; "[RelayDepth] session depth = N entries" — grep the dedicated-server log to confirm it took.
;
; ⛔ [T34] INERT UNDER FLUSH-ON-POLL. Item 34 replaced the replace-latest write path with
; bare C1: relay arrivals are STAGED and the whole stage is published into the ring once per
; Iris poll, at a stage capacity of relayedInputRing::kMaxDepth taken as a CONSTANT. Nothing
; on the live relay path reads this key any more, so changing it changes nothing on the wire.
; The key, its clamp and its proof line are all kept — the tooling greps for them, and a
; deleted proof line is how a knob silently comes back — and the startup line now reads
; "[RelayDepth] session depth = N entries (…) (inert under flush; stage capacity = 8)" so it
; cannot mislead. Leave it at 1: at 1 it also documents that the retired path retained nothing.
RelayRedundancyDepthTicks=1
; [T39] Correction-state rotation width K — how many characters' correction-state buffers
; SimulationNetSync::sendCorrectionAll writes per tick, round-robin. Each character's state then
; replicates at 60*K/N Hz (N = registered characters). A character not written is not dirty and
; costs ZERO bytes, so this is a real wire saving, not a deferred write. Read on the SERVER at
; SimulationManagerUImpl's composition root, clamped to [1, 16], and pushed into
; TimeConfig::correctionRotationK. Server-only and never replicated: only the authority sends
; corrections, and a receiver reconciles against whatever arrives. Consumed ONCE per session — a
; change needs a PIE restart. The effective value is logged at startup as
; "[StateRotation] session K = N" — grep the dedicated-server log to confirm it took.
;
; ⛔ [T34] THE COMPILED DEFAULT IS NOW 1, FOR THE PRE-DIET WINDOW ONLY (30/20/15 Hz at N=2/3/4).
; Not a byte budget: at K=2 with un-dieted 316 B states and bare C1's variable-length rings, the
; SECOND state batch fails inside Iris's huge-object window on roughly a third of frames at four
; characters, which chunks it and blocks that character's newer snapshots for ~1 RTT. At K=1 and
; N <= 4 the residual failures land below the window => clean Abort => the state ships in packet 2
; of the same tick. Item 40 (the wire diet) restores 2. ⚠ A 2-character run therefore corrects at
; 30 Hz, i.e. HALF the archived pre-T34 baselines — designed, not a regression.
; Left commented so the shipped session runs the compiled default.
;CorrectionRotationK=1
; [item 45] Resim TRIGGER POLICY — which landing re-opens the resim gate. Two accepted
; spellings, case-insensitive, matching the enumerator names in TimeConfig::ResimTriggerPolicy:
;   FrontierExact   (compiled default, LEGACY) — anchors only when a correction lands EXACTLY
;                   on the prediction frontier slot, verdict-blind. Reproduces the pre-item-45
;                   gate. Item 43's first run measured what that costs: ~9,100 corrections
;                   landed BEHIND the frontier and were ignored, against ONE resim trigger.
;   OnDisagreement  — VERDICT ONLY, position irrelevant. Any landing whose authority state
;                   disagrees with the prediction sets the pending anchor, wherever it lands.
;                   This is the fix item 46 will ship as the compiled default.
; Read on BOTH roles at SimulationManagerUImpl's composition root (the intake is role-agnostic;
; only a predicting client rewinds, so on a server the gate is reached but never fires), parsed
; case-insensitively, and pushed through SimulationManager::setResimTriggerPolicy ->
; SimulationReconciliation -> every StateCorrectionCache. An UNRECOGNISED string is REPORTED and
; the compiled default kept, never silently read as one of the two — a typo that quietly selected
; OnDisagreement would arm the storm below on a build nobody thinks they changed. Consumed ONCE
; per session, so a change needs a PIE restart. The effective value is logged at startup as
; "[ResimGate] session policy = ..." — grep it to confirm which policy the run actually measured.
;
; ⛔ THIS IS AN EXPERIMENT, NOT ITEM 46. Item 46 is still OPEN and hard-blocked on item 30.
; The key is set here to take ONE cost measurement; the compiled default is deliberately
; unchanged, so deleting this line restores legacy behaviour with no rebuild.
; ⚠ READ THE RESULT AS A COST CEILING, NOT AS THE FIX WORKING. Item 30's verdict is still
; degenerately always-false, so under OnDisagreement "disagrees" is EVERY landing — that is the
; modelled 3-6x physics-cost storm of design section 4. A resim count near the landing count is
; the EXPECTED reading here and does not mean the gate is wrong; it means the verdict is.
; ⚠ THE FLIP IS NOT ONE-BIT. resimGate::policyEnforcesDepthCeiling returns true ONLY for
; OnDisagreement, so this line also ARMS THE DEPTH CEILING, which is TimeConfig::
; rollbackWindowTicks (12). An anchor more than 12 ticks below that character's frontier is
; SKIPPED AND COUNTED (deepAnchorSkips), never clamped. Item 43's baseline run read deepSkips=0
; on both clients because the ceiling was inert; on this run it becomes meaningful for the first
; time, and a large deepSkips is the brake working, not a defect.
ResimTriggerPolicy=OnDisagreement

